# GitHub proposes package and workflow updates once a month as pull requests.
# Each one is built by the "Check site" workflow and gets a Vercel preview link before you merge it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups:
      astro: { patterns: ["astro", "@astrojs/*"] }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
