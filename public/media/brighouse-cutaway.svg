<title id="ct">Illustration: the storm, sanitary and water work NSC built at Brighouse Elementary</title><desc id="cd">Cutaway illustration, not to scale, of the Brighouse Elementary site: upgraded storm and sanitary sewers, a new detention tank and flow control manholes, a precast valve chamber with a double check valve assembly, ductile fittings and a PVC water service, and a new fire hydrant.</desc>
