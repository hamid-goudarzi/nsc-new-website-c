<title id="kc-t">Illustration: what NSC built under Kingston Road</title>
<desc id="kc-d">Cutaway illustration, not to scale, of a section across Kingston Road showing the new storm and sanitary mains, paired precast manholes, a catch basin and storm lead, storm and sanitary service connections to the properties, water service renewal, hydrant and watermain tie-in, and the new concrete curb, sidewalk and paving that replaced the old combined sewer.</desc>
