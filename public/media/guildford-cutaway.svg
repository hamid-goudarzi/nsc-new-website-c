<title id="ct">Illustration: the stormwater detention tank NSC built at Guildford Park Secondary</title><desc id="cd">Cutaway illustration, not to scale, of the Guildford Park Secondary site: bulk excavation for a lined detention tank built from modular chambers, a flow control manhole that meters stored stormwater to the city storm main, storm, sanitary, fire and domestic water and BC Hydro electrical services to the new addition, and new curb and gutter, sidewalk and paving on the frontage.</desc>
