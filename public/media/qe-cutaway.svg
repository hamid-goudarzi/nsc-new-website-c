<title id="ct">Illustration: the city sanitary forcemain NSC rerouted at Queen Elizabeth Elementary</title><desc id="cd">Cutaway illustration, not to scale, of the Queen Elizabeth Elementary site: the new addition sits over the old path of a city sanitary forcemain, which was rerouted and realigned around it while staying in service; storm and sanitary upgrades including twin storm pipes, a fire and domestic water upgrade, bulk excavation for the addition, and new streetlighting, curb and gutter, sidewalks, driveways and paving for the city.</desc>
